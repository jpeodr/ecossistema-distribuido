name: agrodata

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: agrodata-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agrodata_net

  mysql_master:
    image: mysql:8.0
    container_name: agrodata-mysql-master
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_MASTER_PORT:-3310}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agrodata}
      MYSQL_USER: ${MYSQL_USER:-agro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agropass}
    volumes:
      - ./scripts/init_master.sql:/docker-entrypoint-initdb.d/init_master.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agrodata_net

  mysql_slave1:
    image: mysql:8.0
    container_name: agrodata-mysql-slave1
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --relay-log=relay-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --read-only=ON
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_SLAVE1_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      mysql_master:
        condition: service_healthy
    networks:
      - agrodata_net

  mysql_slave2:
    image: mysql:8.0
    container_name: agrodata-mysql-slave2
    command:
      - --server-id=3
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --relay-log=relay-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --read-only=ON
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_SLAVE2_PORT:-3308}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      mysql_master:
        condition: service_healthy
    networks:
      - agrodata_net

  mysql_slave3:
    image: mysql:8.0
    container_name: agrodata-mysql-slave3
    command:
      - --server-id=4
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --relay-log=relay-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --read-only=ON
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_SLAVE3_PORT:-3309}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      mysql_master:
        condition: service_healthy
    networks:
      - agrodata_net

  manager:
    build:
      context: ./manager
      dockerfile: Dockerfile
    container_name: agrodata-manager
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "${MANAGER_PORT:-8000}:8000"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      MYSQL_MASTER_HOST: mysql_master
      MYSQL_SLAVE1_HOST: mysql_slave1
      MYSQL_SLAVE2_HOST: mysql_slave2
      MYSQL_SLAVE3_HOST: mysql_slave3
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agrodata}
      MYSQL_USER: ${MYSQL_USER:-agro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agropass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      SIDRA_TABELA: ${SIDRA_TABELA:-6588}
      SIDRA_PRODUTOS: ${SIDRA_PRODUTOS:-soja,milho,arroz,feijao,trigo,cafe}
      SIDRA_PERIODOS: ${SIDRA_PERIODOS:-2023,2024,2025}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql_master:
        condition: service_healthy
      mysql_slave1:
        condition: service_healthy
      mysql_slave2:
        condition: service_healthy
      mysql_slave3:
        condition: service_healthy
    networks:
      - agrodata_net

  worker1:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: agrodata-worker1
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import pika, os; pika.BlockingConnection(pika.ConnectionParameters(host=os.getenv('RABBITMQ_HOST','rabbitmq'), port=int(os.getenv('RABBITMQ_PORT','5672')), credentials=pika.PlainCredentials(os.getenv('RABBITMQ_DEFAULT_USER','guest'), os.getenv('RABBITMQ_DEFAULT_PASS','guest')), connection_attempts=1)).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      WORKER_ID: worker1
      WORKER_THREADS: ${WORKER_THREADS:-4}
      WORKER_MAX_TENTATIVAS: ${WORKER_MAX_TENTATIVAS:-2}
      WORKER_RETRY_DELAY: ${WORKER_RETRY_DELAY:-2}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      MYSQL_MASTER_HOST: mysql_master
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agrodata}
      MYSQL_USER: ${MYSQL_USER:-agro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agropass}
      SIDRA_TABELA: ${SIDRA_TABELA:-6588}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql_master:
        condition: service_healthy
    networks:
      - agrodata_net

  worker2:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: agrodata-worker2
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import pika, os; pika.BlockingConnection(pika.ConnectionParameters(host=os.getenv('RABBITMQ_HOST','rabbitmq'), port=int(os.getenv('RABBITMQ_PORT','5672')), credentials=pika.PlainCredentials(os.getenv('RABBITMQ_DEFAULT_USER','guest'), os.getenv('RABBITMQ_DEFAULT_PASS','guest')), connection_attempts=1)).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      WORKER_ID: worker2
      WORKER_THREADS: ${WORKER_THREADS:-4}
      WORKER_MAX_TENTATIVAS: ${WORKER_MAX_TENTATIVAS:-2}
      WORKER_RETRY_DELAY: ${WORKER_RETRY_DELAY:-2}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      MYSQL_MASTER_HOST: mysql_master
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agrodata}
      MYSQL_USER: ${MYSQL_USER:-agro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agropass}
      SIDRA_TABELA: ${SIDRA_TABELA:-6588}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql_master:
        condition: service_healthy
    networks:
      - agrodata_net

  worker3:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: agrodata-worker3
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import pika, os; pika.BlockingConnection(pika.ConnectionParameters(host=os.getenv('RABBITMQ_HOST','rabbitmq'), port=int(os.getenv('RABBITMQ_PORT','5672')), credentials=pika.PlainCredentials(os.getenv('RABBITMQ_DEFAULT_USER','guest'), os.getenv('RABBITMQ_DEFAULT_PASS','guest')), connection_attempts=1)).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      WORKER_ID: worker3
      WORKER_THREADS: ${WORKER_THREADS:-4}
      WORKER_MAX_TENTATIVAS: ${WORKER_MAX_TENTATIVAS:-2}
      WORKER_RETRY_DELAY: ${WORKER_RETRY_DELAY:-2}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      MYSQL_MASTER_HOST: mysql_master
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agrodata}
      MYSQL_USER: ${MYSQL_USER:-agro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agropass}
      SIDRA_TABELA: ${SIDRA_TABELA:-6588}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql_master:
        condition: service_healthy
    networks:
      - agrodata_net

networks:
  agrodata_net:
    driver: bridge
