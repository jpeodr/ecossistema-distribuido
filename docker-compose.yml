services:
  # ============================================================
  # MENSAGERIA - RabbitMQ (espinha dorsal da comunicacao)
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Painel de gerenciamento
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================================
  # BANCO DE DADOS - 1 Master (escrita) + 3 Slaves (leitura)
  # ============================================================
  mysql_master:
    image: mysql:8.0
    container_name: mysql_master
    ports:
      - "${MYSQL_MASTER_HOST_PORT:-3310}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: agrodb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    volumes:
      - master_data:/var/lib/mysql
      - ./scripts/init_master.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql_slave1:
    image: mysql:8.0
    container_name: mysql_slave1
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: agrodb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    command: >
      --server-id=2
      --read-only=1
      --log-bin=mysql-bin
      --relay-log=mysql-relay-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --skip-replica-start
    volumes:
      - slave1_data:/var/lib/mysql
    networks:
      - app_network
    depends_on:
      mysql_master:
        condition: service_healthy

  mysql_slave2:
    image: mysql:8.0
    container_name: mysql_slave2
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: agrodb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    command: >
      --server-id=3
      --read-only=1
      --log-bin=mysql-bin
      --relay-log=mysql-relay-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --skip-replica-start
    volumes:
      - slave2_data:/var/lib/mysql
    networks:
      - app_network
    depends_on:
      mysql_master:
        condition: service_healthy

  mysql_slave3:
    image: mysql:8.0
    container_name: mysql_slave3
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: agrodb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    command: >
      --server-id=4
      --read-only=1
      --log-bin=mysql-bin
      --relay-log=mysql-relay-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --skip-replica-start
    volumes:
      - slave3_data:/var/lib/mysql
    networks:
      - app_network
    depends_on:
      mysql_master:
        condition: service_healthy

  # ============================================================
  # NO MANAGER - coordena a coleta, fatia o trabalho e enfileira
  # ============================================================
  manager:
    build: ./manager
    container_name: manager
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      MYSQL_MASTER_HOST: mysql_master
      MYSQL_SLAVE_HOSTS: mysql_slave1,mysql_slave2,mysql_slave3
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: agrodb
      SIDRA_TABELA: ${SIDRA_TABELA:-6588}
      SIDRA_PERIODOS: ${SIDRA_PERIODOS:-last 12}
      SIDRA_VARIAVEIS: ${SIDRA_VARIAVEIS:-35,36,109,216}
      SIDRA_PRODUTOS: ${SIDRA_PRODUTOS:-39443,39441,39442,39456,39432,39454,39436,39445,39467,39429}
    networks:
      - app_network
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql_master:
        condition: service_healthy

  # ============================================================
  # NOS WORKERS - processamento distribuido (3 replicas)
  # Cada worker consome tarefas da fila e processa em threads
  # ============================================================
  worker:
    build: ./worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      MYSQL_MASTER_HOST: mysql_master
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_DATABASE: agrodb
      SIDRA_TABELA: ${SIDRA_TABELA:-6588}
      SIDRA_PERIODOS: ${SIDRA_PERIODOS:-last 12}
      SIDRA_VARIAVEIS: ${SIDRA_VARIAVEIS:-35,36,109,216}
      WORKER_THREADS: ${WORKER_THREADS:-4}
    networks:
      - app_network
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql_master:
        condition: service_healthy
    deploy:
      replicas: 3

networks:
  app_network:
    driver: bridge

volumes:
  master_data:
  slave1_data:
  slave2_data:
  slave3_data:
